<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة النتائج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="mb-4">
      <h1 class="h3 fw-bold mb-1">نظام إدارة النتائج</h1>
      <p class="text-muted mb-0">أضف الطلاب ثم فعّل لجنة الرأفة لمعالجة المتعثرين.</p>
    </header>

    <div class="row g-4">
      <!-- نموذج الإدخال -->
      <section class="col-lg-5">
        <div class="card panel">
          <div class="card-body">
            <h2 class="h5 fw-bold mb-3">بيانات الطالب</h2>

            <div class="mb-3">
              <label for="studentName" class="form-label">اسم الطالب</label>
              <input type="text" id="studentName" class="form-control" placeholder="مثال: أحمد محمد">
            </div>

            <div class="row g-3 mb-3">
              <div class="col-12 col-sm-4">
                <label for="grade1" class="form-label">المادة الأولى</label>
                <input type="number" id="grade1" class="form-control" min="0" max="100">
              </div>
              <div class="col-12 col-sm-4">
                <label for="grade2" class="form-label">المادة الثانية</label>
                <input type="number" id="grade2" class="form-control" min="0" max="100">
              </div>
              <div class="col-12 col-sm-4">
                <label for="grade3" class="form-label">المادة الثالثة</label>
                <input type="number" id="grade3" class="form-control" min="0" max="100">
              </div>
            </div>

            <div class="mb-3">
              <label for="attendance" class="form-label">نسبة الحضور (%)</label>
              <input type="number" id="attendance" class="form-control" min="0" max="100">
            </div>

            <!-- صندوق رسائل الخطأ -->
            <div id="errorBox" class="error-box mb-3" role="alert" aria-live="polite"></div>

            <div class="d-grid gap-2 d-sm-flex">
              <button type="button" id="addBtn" class="btn btn-primary flex-fill">إضافة طالب</button>
              <button type="button" id="mercyBtn" class="btn btn-outline-dark flex-fill">تفعيل لجنة الرأفة</button>
            </div>
          </div>
        </div>
      </section>

      <!-- مناطق العرض -->
      <section class="col-lg-7">
        <div class="card panel mb-4">
          <div class="card-body">
            <h2 class="h5 fw-bold mb-3">الطلاب المضافون</h2>
            <div id="studentsBox">
              <p class="text-muted mb-0">لا يوجد طلاب بعد. أضف أول طالب من النموذج.</p>
            </div>
          </div>
        </div>

        <div class="card panel">
          <div class="card-body">
            <h2 class="h5 fw-bold mb-3">التقرير النهائي</h2>
            <div id="reportBox">
              <p class="text-muted mb-0">سيظهر التقرير هنا بعد تفعيل لجنة الرأفة.</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
